<!DOCTYPE html>
<!--
  Lekce 3 – stejné HTML jako v lekci 2, jen ho teď servíruje Express
  a data si app.js bere ze serveru přes API.
  Spusť server (npm run dev) a otevři http://localhost:3000
-->
<html lang="cs">
<head>
  <!-- Kódování znaků: bez toho by se rozbila čeština (ěščřžýáíé). -->
  <meta charset="UTF-8">
  <!-- Bez viewportu by se stránka na mobilu zobrazila zmenšená jako na počítači. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poradna – zeptej se na cokoliv z IT</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Sémantické značky (header, main, section, footer) říkají prohlížeči
       i čtečkám obrazovky, JAKÝ význam má která část stránky. -->
  <header class="site-header">
    <h1>Poradna</h1>
    <p>Zeptej se na cokoliv z webového vývoje. Nikdo se nesměje.</p>
  </header>

  <main class="layout">
    <section class="card" aria-labelledby="form-title">
      <h2 id="form-title">Nová otázka</h2>

      <!-- Formulář: každý vstup má svůj <label>. Kliknutí na label přesune
           kurzor do pole a čtečka obrazovky ví, k čemu pole slouží. -->
      <form id="question-form">
        <label for="title">Otázka</label>
        <input id="title" name="title" type="text" placeholder="Např. Jaký hosting pro WordPress?">

        <label for="body">Podrobnosti</label>
        <textarea id="body" name="body" rows="4" placeholder="Popiš, co přesně řešíš…"></textarea>

        <label for="category">Kategorie</label>
        <select id="category" name="category">
          <option value="frontend">Frontend</option>
          <option value="backend">Backend</option>
          <option value="hosting">Hosting a domény</option>
          <option value="jine">Jiné</option>
        </select>

        <button type="submit">Odeslat otázku</button>
        <!-- Sem vypíšeme chybu, kterou vrátí server (např. příliš krátká otázka).
             aria-live zajistí, že ji čtečka obrazovky přečte nahlas. -->
        <p id="error" class="error" aria-live="polite"></p>
      </form>
    </section>

    <section aria-labelledby="list-title">
      <h2 id="list-title">Otázky <span id="count" class="count">0</span></h2>
      <!-- Seznam je zatím prázdný, položky do něj vkládá JavaScript (app.js). -->
      <ul id="question-list" class="question-list"></ul>
    </section>
  </main>

  <footer class="site-footer">Kroužek Základy webového vývoje</footer>

  <script src="app.js"></script>
</body>
</html>
